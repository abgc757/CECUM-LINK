services:
  postgres:
    image: postgres:16-alpine
    container_name: cecum_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cecumlink}
      POSTGRES_USER: ${DB_USER:-cecum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cecum_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cecum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cecum_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cecum}:${DB_PASSWORD:-cecum_secret}@postgres:5432/${DB_NAME:-cecumlink}
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion_secreto_muy_largo}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    container_name: cecum_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"
    volumes:
      - uploads_data:/app/uploads:ro

volumes:
  postgres_data:
  uploads_data:
