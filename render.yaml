databases:
  - name: cecumlink-db
    databaseName: cecumlink
    user: cecum
    plan: free
    region: oregon

services:
  - type: web
    name: cecumlink-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cecumlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://cecumlink-frontend.onrender.com

  - type: web
    name: cecumlink-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.render
    dockerContext: ./frontend
    region: oregon
    plan: free
    envVars:
      - key: BACKEND_URL
        value: cecumlink-backend.onrender.com
